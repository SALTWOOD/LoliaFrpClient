name: Android

# 与 desktop-windows.yml / desktop-linux.yml 完全独立,三个 workflow 并行跑。
# 发布说明在这里生成一次就够,另外两个只负责挂文件。
#
# frpc 不从上游 release 下预编译产物,而是按 FRPC_REF 拉源码现编:
# 这样内置哪个版本由这里决定,能跟上游任意 tag / 分支 / commit 走。

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      frpc_ref:
        description: "lolia-frp 的 tag / 分支 / commit(决定内置 frpc 的版本)"
        required: false
        default: "v0.71.1"
        type: string

permissions:
  contents: write

env:
  # 手动触发时可以覆盖成别的版本,例如 v0.70.0 或某个 commit。
  FRPC_REF: ${{ inputs.frpc_ref || 'v0.71.1' }}
  NDK_VERSION: r26c

jobs:
  # ── 从源码编译 frpc ──
  frpc:
    name: frpc (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android21-clang
            machine: b700   # ELF e_machine,小端存放
          - abi: x86_64
            goarch: amd64
            cc: x86_64-linux-android21-clang
            machine: 3e00

    steps:
      - name: Checkout frpc source
        uses: actions/checkout@v4
        with:
          repository: Lolia-FRP/lolia-frp
          ref: ${{ env.FRPC_REF }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 跟着源码自己声明的版本走,上游升 Go 时这里不用改。
          go-version-file: go.mod

      - name: Cache Android NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: Install Android NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          rm -f ndk.zip

      # 必须用 GOOS=android + CGO + NDK,不能用 GOOS=linux + CGO_ENABLED=0。
      #
      # 后者出来的是静态二进制,跑得起来、但**解析不了域名**:Go 的纯 Go 解析器要读
      # /etc/resolv.conf,而 Android 上这个文件不存在,它会退到 [::1]:53 然后 connection refused。
      # (实测过:同一台设备上 LookupHost("api.lolia.link") 直接失败。)
      # 而 app 启动 frpc 时只传 -t id:token,服务器地址要靠 frpc 自己去 api.lolia.link 取,
      # 所以没有域名解析 = 隧道连不上。
      #
      # GOOS=android 走 cgo,解析交给 bionic 的 getaddrinfo(它经 netd 说话),这才可用。
      # 代价是必须配 NDK —— 上游也是这么做的。
      #
      # -checklinkname=0:Go 1.23+ 对 pion 依赖 wlynxg/anet 的 //go:linkname net.zoneCache
      #   在 android 目标上会链接失败,上游 LDFLAGS 里也有这一条。
      # noweb:浅克隆里没有 web/*/dist,不排掉会在 embed 处报 "pattern dist: no matching files"。
      #   frpc 的本地 web 面板我们用不上,本应用有自己的界面。
      - name: Build frpc
        env:
          CC: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}
          CXX: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}++
        run: |
          set -euo pipefail
          mkdir -p out
          CGO_ENABLED=1 GOOS=android GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -checklinkname=0" -tags "frpc,noweb" \
            -o out/libfrpc.so ./cmd/frpc

          DEST=out/libfrpc.so
          MAGIC="$(od -An -tx1 -N4 "$DEST" | tr -d ' \n')"
          [ "$MAGIC" = "7f454c46" ] || { echo "不是 ELF(magic=$MAGIC)"; exit 1; }

          # 架构核对:GOARCH 写错时会编出一个能打包、要到真机上才以 exec format error 暴露的包。
          MACHINE="$(od -An -tx1 -j18 -N2 "$DEST" | tr -d ' \n')"
          [ "$MACHINE" = "${{ matrix.machine }}" ] \
            || { echo "架构不符:e_machine=0x$MACHINE,应为 0x${{ matrix.machine }}"; exit 1; }

          # 必须是动态链接到 Android 的 linker。静态二进制(即错用了 GOOS=linux)能通过上面两项检查,
          # 却会在设备上解析不了任何域名 —— 这道检查就是为了拦住那个错误。
          grep -qa "/system/bin/linker" "$DEST" \
            || { echo "不是 Android 目标:找不到 /system/bin/linker64 解释器。"; \
                 echo "多半是误用了 GOOS=linux,那样编出来的是静态二进制,在设备上解析不了域名。"; exit 1; }

          echo "frpc ${{ matrix.abi }}:$(stat -c%s "$DEST") 字节"
          file "$DEST" || true

      - name: Upload frpc
        uses: actions/upload-artifact@v4
        with:
          name: frpc-${{ matrix.abi }}
          path: out/libfrpc.so
          retention-days: 1

  # ── 打包 APK ──
  apk:
    name: Build APKs
    needs: frpc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frpc
        uses: actions/download-artifact@v4
        with:
          # 每个 ABI 一个 artifact,下载后各自落在以 artifact 名命名的子目录里,
          # 下面再摆成 lib/<abi>/libfrpc.so —— SDK 自带的 AutoImport.props 会自动 glob
          # 这个目录,不要再写 AndroidNativeLibrary(重复项会让 ABI 推断取到错的那条)。
          pattern: frpc-*
          path: frpc-libs

      - name: Place frpc
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            mkdir -p "LoliaFrpClient.Android/lib/$abi"
            mv "frpc-libs/frpc-$abi/libfrpc.so" "LoliaFrpClient.Android/lib/$abi/libfrpc.so"
            echo "$abi: $(stat -c%s "LoliaFrpClient.Android/lib/$abi/libfrpc.so") 字节"
          done
          rm -rf frpc-libs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # .NET Android 要求的 JDK 17(21 也能跑,但 17 是官方支持版本)。
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK
        run: >
          dotnet build LoliaFrpClient.Android/LoliaFrpClient.Android.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AcceptAndroidSDKLicenses=true
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Resolve versions
        id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "app=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "app=dev-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi
          echo "frpc=$(echo "${{ env.FRPC_REF }}" | sed 's|^v||; s|/|-|g')" >> "$GITHUB_OUTPUT"

      - name: Build APK (arm64)
        run: >
          dotnet build LoliaFrpClient.Android/LoliaFrpClient.Android.csproj
          -c Release -f net10.0-android -p:RuntimeIdentifier=android-arm64
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"

      # 预览包:给模拟器看界面、跑隧道用,真机几乎没有 x86_64。
      - name: Build APK (x86_64, emulator preview)
        run: >
          dotnet build LoliaFrpClient.Android/LoliaFrpClient.Android.csproj
          -c Release -f net10.0-android -p:RuntimeIdentifier=android-x64
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Collect APKs
        run: |
          set -euo pipefail
          A="${{ steps.v.outputs.app }}"
          F="${{ steps.v.outputs.frpc }}"
          BIN=LoliaFrpClient.Android/bin/Release/net10.0-android
          # 文件名带上内置 frpc 的版本:同一个 app 版本可以出多个 frpc 版本。
          cp "$BIN/android-arm64/com.loliafrp.client-Signed.apk" \
             "LoliaFrpClient_${A}_android-arm64_frpc-${F}.apk"
          cp "$BIN/android-x64/com.loliafrp.client-Signed.apk" \
             "LoliaFrpClient_${A}_android-x86_64_frpc-${F}-preview.apk"
          ls -l ./*.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoliaFrpClient-${{ steps.v.outputs.app }}-android-frpc${{ steps.v.outputs.frpc }}
          path: ./*.apk
          retention-days: 7

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./*.apk
          generate_release_notes: true
