name: Android

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      frpc_ref:
        description: "lolia-frp tag / branch / commit (sets the bundled frpc version)"
        required: false
        default: "v0.71.1"
        type: string

permissions:
  contents: read

env:
  # Override on manual runs, e.g. v0.70.0 or a commit.
  FRPC_REF: ${{ inputs.frpc_ref || 'v0.71.1' }}
  NDK_VERSION: r26c

jobs:
  # ── Build frpc from source ──
  frpc:
    name: frpc (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android21-clang
            machine: "b700"   # ELF e_machine for AArch64, little-endian
          - abi: x86_64
            goarch: amd64
            cc: x86_64-linux-android21-clang
            machine: "3e00"   # ELF e_machine for x86-64, little-endian

    steps:
      - name: Checkout frpc source
        uses: actions/checkout@v4
        with:
          repository: Lolia-FRP/lolia-frp
          ref: ${{ env.FRPC_REF }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Follows the version the source declares; nothing to edit when upstream bumps Go.
          go-version-file: go.mod

      - name: Cache Android NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: Install Android NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          rm -f ndk.zip

      # GOOS=android + CGO + NDK is required here. GOOS=linux + CGO_ENABLED=0 produces a
      # static binary that runs but cannot resolve any hostname: Go's pure resolver reads
      # /etc/resolv.conf, which does not exist on Android, so it falls back to [::1]:53 and
      # fails. Measured on a real device: LookupHost("api.lolia.link") simply fails.
      # The app starts frpc with only -t id:token, so frpc must reach api.lolia.link itself
      # to fetch its config. No DNS means no tunnel.
      # GOOS=android uses cgo, handing resolution to bionic's getaddrinfo (via netd).
      # The price is the NDK; upstream pays it too.
      #
      # -checklinkname=0: Go 1.23+ fails to link wlynxg/anet's //go:linkname net.zoneCache
      #   on android targets. Upstream carries the same flag.
      # noweb: a shallow clone has no web/*/dist, and the embed then fails with
      #   "pattern dist: no matching files". frpc's local web panel is unused here.
      - name: Build frpc
        env:
          CC: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}
          CXX: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}++
        run: |
          set -euo pipefail
          mkdir -p out
          CGO_ENABLED=1 GOOS=android GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -checklinkname=0" -tags "frpc,noweb" \
            -o out/libfrpc.so ./cmd/frpc

          DEST=out/libfrpc.so
          MAGIC="$(od -An -tx1 -N4 "$DEST" | tr -d ' \n')"
          [ "$MAGIC" = "7f454c46" ] || { echo "not an ELF file (magic=$MAGIC)"; exit 1; }

          # Arch check: a wrong GOARCH still packages fine and only fails on device.
          MACHINE="$(od -An -tx1 -j18 -N2 "$DEST" | tr -d ' \n')"
          [ "$MACHINE" = "${{ matrix.machine }}" ] \
            || { echo "wrong arch: e_machine=0x$MACHINE, expected 0x${{ matrix.machine }}"; exit 1; }

          # Must link against Android's linker. A static binary (i.e. GOOS=linux by mistake)
          # passes both checks above yet resolves no hostname on device; this catches that.
          grep -qa "/system/bin/linker" "$DEST" \
            || { echo "not an Android target: no /system/bin/linker64 interpreter found."; \
                 echo "most likely GOOS=linux, whose static binary cannot resolve DNS on device."; exit 1; }

          echo "frpc ${{ matrix.abi }}: $(stat -c%s "$DEST") bytes"
          file "$DEST" || true

      - name: Upload frpc
        uses: actions/upload-artifact@v4
        with:
          name: frpc-${{ matrix.abi }}
          path: out/libfrpc.so
          retention-days: 1

  # ── Package the APKs ──
  apk:
    name: Build APKs
    needs: frpc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Signing. Without this the SDK falls back to a debug keystore it generates per
      # runner, so every run produces a differently-signed APK and installing an update
      # over an older one fails with "signature mismatch". The keystore has to be the
      # same one on every machine, hence a secret.
      #
      # The two files written here mirror the local signing.props, which the csproj
      # imports when it exists, so CI and a local Release build hit the same code path.
      # Fork PRs get no secrets; they fall back to the debug keystore, as before.
      - name: Write signing props
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "no keystore secret (fork PR) — the SDK will use its own debug keystore"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > loliafrp-release.keystore
          cat > signing.props <<EOF
          <Project>
            <PropertyGroup>
              <AndroidKeyStore>true</AndroidKeyStore>
              <AndroidSigningKeyStore>\$(MSBuildThisFileDirectory)loliafrp-release.keystore</AndroidSigningKeyStore>
              <AndroidSigningStorePass>$KEYSTORE_PASSWORD</AndroidSigningStorePass>
              <AndroidSigningKeyAlias>$KEY_ALIAS</AndroidSigningKeyAlias>
              <AndroidSigningKeyPass>$KEY_PASSWORD</AndroidSigningKeyPass>
            </PropertyGroup>
          </Project>
          EOF

      - name: Download frpc
        uses: actions/download-artifact@v4
        with:
          # One artifact per ABI, each landing in a subdirectory named after it.
          # Moved below into lib/<abi>/libfrpc.so, which the SDK's own AutoImport.props
          # globs automatically. Do not add AndroidNativeLibrary: duplicate entries make
          # the ABI inference pick the wrong one.
          pattern: frpc-*
          path: frpc-libs

      - name: Place frpc
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            mkdir -p "LoliaFrpClient.Android/lib/$abi"
            mv "frpc-libs/frpc-$abi/libfrpc.so" "LoliaFrpClient.Android/lib/$abi/libfrpc.so"
            echo "$abi: $(stat -c%s "LoliaFrpClient.Android/lib/$abi/libfrpc.so") bytes"
          done
          rm -rf frpc-libs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # .NET Android requires JDK 17 (21 works, but 17 is the supported one).
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK
        run: >
          dotnet build LoliaFrpClient.Android/LoliaFrpClient.Android.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AcceptAndroidSDKLicenses=true
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Resolve versions
        id: v
        run: |
          set -euo pipefail
          # The version lives in Directory.Build.props and nowhere else. A tag that
          # disagrees with it would ship binaries carrying the old number under a new
          # tag name, so refuse to build. scripts/set-version.ps1 writes both.
          FILE_VER="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            [ "${{ github.ref_name }}" = "v$FILE_VER" ] || {
              echo "tag ${{ github.ref_name }} but Directory.Build.props says $FILE_VER"; exit 1; }
            echo "app=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "app=dev-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi
          echo "frpc=$(echo "${{ env.FRPC_REF }}" | sed 's|^v||; s|/|-|g')" >> "$GITHUB_OUTPUT"

      - name: Build APK (arm64)
        run: >
          dotnet build LoliaFrpClient.Android/LoliaFrpClient.Android.csproj
          -c Release -f net10.0-android -p:RuntimeIdentifier=android-arm64
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"

      # Preview build: lets an emulator show the UI and run tunnels. Real x86_64 phones
      # are essentially nonexistent, and upstream ships no x86_64 frpc.
      - name: Build APK (x86_64, emulator preview)
        run: >
          dotnet build LoliaFrpClient.Android/LoliaFrpClient.Android.csproj
          -c Release -f net10.0-android -p:RuntimeIdentifier=android-x64
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Collect APKs
        run: |
          set -euo pipefail
          A="${{ steps.v.outputs.app }}"
          F="${{ steps.v.outputs.frpc }}"
          BIN=LoliaFrpClient.Android/bin/Release/net10.0-android
          # The filename carries the bundled frpc version, so one app version can ship
          # against several frpc versions.
          cp "$BIN/android-arm64/com.loliafrp.client-Signed.apk" \
             "LoliaFrpClient_${A}_android-arm64_frpc-${F}.apk"
          cp "$BIN/android-x64/com.loliafrp.client-Signed.apk" \
             "LoliaFrpClient_${A}_android-x86_64_frpc-${F}-preview.apk"
          ls -l ./*.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoliaFrpClient-${{ steps.v.outputs.app }}-android-frpc${{ steps.v.outputs.frpc }}
          path: ./*.apk
          retention-days: 7
