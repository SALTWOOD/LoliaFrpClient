name: Desktop (Windows)

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # The project targets net10.0, not 8.0.
          dotnet-version: 10.0.x

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          # The version lives in Directory.Build.props and nowhere else. A tag that
          # disagrees with it would ship binaries carrying the old number under a new
          # tag name, so refuse to build. scripts/set-version.ps1 writes both.
          $fileVer = [regex]::Match(
            (Get-Content Directory.Build.props -Raw), '<Version>([^<]*)</Version>').Groups[1].Value

          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -ne "v$fileVer") {
              throw "tag ${{ github.ref_name }} but Directory.Build.props says $fileVer"
            }
            $display = "${{ github.ref_name }}"
          } else {
            $display = "dev-" + "${{ github.sha }}".Substring(0, 7)
          }
          Write-Host "Log: version -> $display"
          "display=$display" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The entry project is LoliaFrpClient.Desktop. LoliaFrpClient is a shared library
      # now, so publishing it directly would only produce a dll.
      - name: Publish win-x64
        run: >
          dotnet publish LoliaFrpClient.Desktop/LoliaFrpClient.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -o publish/win-x64

      - name: Publish win-arm64
        run: >
          dotnet publish LoliaFrpClient.Desktop/LoliaFrpClient.Desktop.csproj
          -c Release -r win-arm64 --self-contained true
          -o publish/win-arm64

      - name: Package ZIPs
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.display }}"
          Compress-Archive -Path publish/win-x64/*   -DestinationPath "LoliaFrpClient_${v}_win-x64.zip"
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "LoliaFrpClient_${v}_win-arm64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoliaFrpClient-${{ steps.v.outputs.display }}-windows
          path: ./*.zip
          retention-days: 7
